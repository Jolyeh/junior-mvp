<router-outlet></router-outlet>
@if (feedback.notice(); as notice) { <div class="toast" [class.error]="notice.kind === 'error'" [class.info]="notice.kind === 'info'" [attr.role]="notice.kind === 'error' ? 'alert' : 'status'"><lucide-icon [img]="notice.kind === 'error' ? icons.AlertCircle : icons.CheckCircle2" size="20"></lucide-icon><span>{{notice.message}}</span><button (click)="feedback.notice.set(null)" aria-label="Fermer la notification"><lucide-icon [img]="icons.X" size="17"></lucide-icon></button></div> }
@if (feedback.confirmation(); as dialog) { <div class="dialog-backdrop" (click)="feedback.confirmation.set(null)"><section class="confirm-dialog" role="alertdialog" aria-modal="true" aria-labelledby="confirm-title" (click)="$event.stopPropagation()"><div class="confirm-icon"><lucide-icon [img]="icons.AlertTriangle" size="24"></lucide-icon></div><h2 id="confirm-title">{{dialog.title}}</h2><p>{{dialog.text}}</p><div class="confirm-actions"><button class="btn-secondary" (click)="feedback.confirmation.set(null)">Annuler</button><button class="btn-danger" (click)="feedback.accept()">Oui, supprimer</button></div></section></div> }
